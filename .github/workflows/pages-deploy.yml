name: Build and Deploy

on:
  push:
    branches: [main, master]
    paths-ignore: [README.md, LICENSE]
  workflow_dispatch:
  # Check the public content repository without a cross-repository credential.
  schedule:
    - cron: '7,22,37,52 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.content.outputs.build }}
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
      - name: Check for content changes
        id: content
        run: bundle exec ruby tools/build.rb --check-updates --github-output "$GITHUB_OUTPUT"
      - name: Set up GitHub Pages
        if: steps.content.outputs.build == 'true'
        uses: actions/configure-pages@v6
      - name: Assemble and build site
        if: steps.content.outputs.build == 'true'
        run: bundle exec ruby tools/build.rb
        env:
          JEKYLL_ENV: production
      - name: Check generated pages and local links
        if: steps.content.outputs.build == 'true'
        run: python3 tools/check_site.py .build/output
      - name: Upload site
        if: steps.content.outputs.build == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: .build/output

  deploy:
    needs: build
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
