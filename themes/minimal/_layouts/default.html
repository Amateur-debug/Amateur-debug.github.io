<!doctype html>
<html lang="{{ site.lang | default: 'zh-CN' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    {% seo %}
    <link rel="stylesheet" href="{{ '/assets/css/minimal.css' | relative_url }}">
    <link rel="alternate" type="application/atom+xml" title="{{ site.title | escape }}" href="{{ '/feed.xml' | relative_url }}">
  </head>
  <body>
    <a class="skip" href="#main">跳到正文</a>
    <div class="shell">
      <header>
        <a class="brand" href="{{ '/' | relative_url }}">{{ site.title }}</a>
        <p class="tagline">{{ site.tagline }}</p>
        <nav aria-label="主导航">
          <a href="{{ '/' | relative_url }}"{% if page.url == '/' %} aria-current="page"{% endif %}>首页</a>
          <a href="{{ '/blog/' | relative_url }}"{% if page.url contains '/blog/' %} aria-current="page"{% endif %}>博客</a>
          {% for tab in site.tabs %}
            <a href="{{ tab.url | relative_url }}"{% if page.url == tab.url %} aria-current="page"{% endif %}>{{ tab.title }}</a>
          {% endfor %}
        </nav>
      </header>
      <main id="main">{{ content }}</main>
      <footer>© {{ 'now' | date: '%Y' }} {{ site.social.name | default: site.title }} · <a href="{{ '/feed.xml' | relative_url }}">RSS</a></footer>
    </div>
  </body>
</html>
